name: IAmSpeed Physical Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamspeed-physical-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-contracts:
    # Fork PR code must never run on a self-hosted Docker runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          path: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false

      - name: Check portable Docker launcher
        shell: python {0}
        working-directory: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', 'HostProject/Scripts/TestDockerContracts.py'], check=True)

      - name: Build and test exact checkout in UE 5.8.2 image
        id: contracts
        shell: python {0}
        env:
          IAMSPEED_CONFIGURED_IMAGE: ${{ vars.IAMSPEED_UE_IMAGE }}
          IAMSPEED_EXPECTED_SHA: ${{ github.sha }}
        working-directory: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os, subprocess, sys
          configured = os.environ.get('IAMSPEED_CONFIGURED_IMAGE', '').strip()
          if configured:
              os.environ['IAMSPEED_UE_IMAGE'] = configured
          subprocess.run([sys.executable, '-B', 'HostProject/Scripts/RunDockerContracts.py'], check=True)

      - name: Upload exact run diagnostics
        if: always() && steps.contracts.outputs.output_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: iamspeed-physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.contracts.outputs.output_dir }}/Logs/**
            ${{ steps.contracts.outputs.output_dir }}/Automation/**
            ${{ steps.contracts.outputs.output_dir }}/*.json
            ${{ steps.contracts.outputs.output_dir }}/container.stdout.log
          if-no-files-found: warn
