name: IAmSpeed Physical Contracts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamspeed-physical-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-project:
    # Never dispatch untrusted fork pull requests to the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false

      - name: Validate HostProject contract runner
        shell: powershell
        env:
          IAMSPEED_UE_ROOT: ${{ vars.IAMSPEED_UE_ROOT }}
          IAMSPEED_RULES_ENGINE_ROOT: ${{ vars.IAMSPEED_RULES_ENGINE_ROOT }}
          IAMSPEED_PRIVATE_UBT_MANIFEST: 'E:\UEQualification\ias-ci21\CI-v30\mission\ci30-private-ubt-runtime-manifest-GitHubCI.json'
          IAMSPEED_PRIVATE_UBT_MANIFEST_SHA256: '01f26712509605e66338255c65feeef99ef4dcbbfaf33ae59a9ee5b28c0ee8cc'
          IAMSPEED_PRIVATE_ROOT: 'E:\UEQualification\ias-ci21\CI-v30\Runtime-GitHubCI'
        working-directory: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IAMSPEED_PRIVATE_UBT_MANIFEST) -or
              [string]::IsNullOrWhiteSpace($env:IAMSPEED_PRIVATE_UBT_MANIFEST_SHA256)) {
            throw 'The workflow's pinned private UBT manifest path and SHA-256 are required.'
          }
          if (-not (Test-Path -LiteralPath $env:IAMSPEED_PRIVATE_UBT_MANIFEST -PathType Leaf)) {
            throw "The runner's pinned private UBT manifest is missing: $env:IAMSPEED_PRIVATE_UBT_MANIFEST"
          }
          $manifestSha = (Get-FileHash -LiteralPath $env:IAMSPEED_PRIVATE_UBT_MANIFEST -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestSha -cne $env:IAMSPEED_PRIVATE_UBT_MANIFEST_SHA256) {
            throw 'The runner private UBT manifest SHA-256 differs from the workflow pin.'
          }
          .\HostProject\Scripts\TestRunContracts.ps1

      - name: Build HostProject and run physical contracts
        shell: powershell
        env:
          IAMSPEED_UE_ROOT: ${{ vars.IAMSPEED_UE_ROOT }}
          IAMSPEED_RULES_ENGINE_ROOT: ${{ vars.IAMSPEED_RULES_ENGINE_ROOT }}
          IAMSPEED_PRIVATE_UBT_MANIFEST: 'E:\UEQualification\ias-ci21\CI-v30\mission\ci30-private-ubt-runtime-manifest-GitHubCI.json'
          IAMSPEED_PRIVATE_UBT_MANIFEST_SHA256: '01f26712509605e66338255c65feeef99ef4dcbbfaf33ae59a9ee5b28c0ee8cc'
          IAMSPEED_PRIVATE_ROOT: 'E:\UEQualification\ias-ci21\CI-v30\Runtime-GitHubCI'
        working-directory: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $engineRoot = $env:IAMSPEED_UE_ROOT
          if ([string]::IsNullOrWhiteSpace($engineRoot)) {
            throw 'Configure the IAMSPEED_UE_ROOT repository variable with the qualified physical Unreal Engine root before running IAmSpeed CI.'
          }
          if ([string]::IsNullOrWhiteSpace($env:IAMSPEED_RULES_ENGINE_ROOT)) {
            throw 'Configure the IAMSPEED_RULES_ENGINE_ROOT repository variable with the qualified E-slot rules seed root before running IAmSpeed CI.'
          }
          if ([string]::IsNullOrWhiteSpace($env:IAMSPEED_PRIVATE_UBT_MANIFEST) -or
              [string]::IsNullOrWhiteSpace($env:IAMSPEED_PRIVATE_UBT_MANIFEST_SHA256)) {
            throw 'Configure IAMSPEED_PRIVATE_UBT_MANIFEST and IAMSPEED_PRIVATE_UBT_MANIFEST_SHA256 repository variables for the private Query runtime.'
          }
          .\HostProject\Scripts\RunContracts.ps1 -EngineRoot $engineRoot

      - name: Upload HostProject logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamspeed-host-project-logs
          path: |
            ${{ runner.temp }}/IAmSpeedPrivate/**/Logs/*
            ${{ runner.temp }}/IAmSpeedPrivate/**/Automation/*
          if-no-files-found: ignore
