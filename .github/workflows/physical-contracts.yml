name: IAmSpeed Physical Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamspeed-physical-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate portable CI scripts without Unreal
        shell: powershell
        run: |
          $tests = Join-Path $env:RUNNER_TEMP 'IAmSpeed-RunnerContracts'
          foreach ($file in Get-ChildItem -LiteralPath .\HostProject\Scripts -Filter '*.ps1' -File) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "PowerShell syntax error: $($file.FullName)" }
          }
          .\HostProject\Scripts\TestParallelContractCoverage.ps1 -TestOutputRoot $tests
          .\HostProject\Scripts\TestCiRuntimeConfiguration.ps1 -TestOutputRoot $tests
      - name: Validate collision matrix artifact contracts without Unreal
        shell: python {0}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-I', '-B', 'HostProject/Scripts/TestCollisionMatrix042.py'], check=True)

  docker-contracts:
    needs: runner-contracts
    # Fork PR code must never run on a self-hosted Docker runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, skyleague-ci]
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          path: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false

      - name: Check portable Docker launcher
        shell: python {0}
        working-directory: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', 'HostProject/Scripts/TestDockerContracts.py'], check=True)

      - name: Build and test exact checkout in UE 5.8.2 image
        id: contracts
        shell: python {0}
        env:
          IAMSPEED_CONFIGURED_IMAGE: ${{ vars.IAMSPEED_UE_IMAGE }}
          IAMSPEED_EXPECTED_SHA: ${{ github.sha }}
          IAMSPEED_CONFIGURED_CPUSET: ${{ vars.IAMSPEED_CPUSET_CPUS }}
          IAMSPEED_CONFIGURED_OUTPUT_ROOT: ${{ vars.IAMSPEED_OUTPUT_ROOT }}
        working-directory: .ci/physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          import os, subprocess, sys
          configured = os.environ.get('IAMSPEED_CONFIGURED_IMAGE', '').strip()
          if configured:
              os.environ['IAMSPEED_UE_IMAGE'] = configured
          # CPU IDs belong to the runner Linux VM, not Windows processor numbering.
          cpuset = os.environ.get('IAMSPEED_CONFIGURED_CPUSET', '').strip()
          if not cpuset:
              raise RuntimeError('Configure IAMSPEED_CPUSET_CPUS from the runner Linux sysfs topology; no portable numeric default')
          from pathlib import Path
          output_root = os.environ.get('IAMSPEED_CONFIGURED_OUTPUT_ROOT', '').strip()
          if not output_root:
              raise RuntimeError('Configure a short runner-local IAMSPEED_OUTPUT_ROOT; source and evidence paths must fit Windows limits')
          output = Path(output_root) / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          subprocess.run([sys.executable, '-B', 'HostProject/Scripts/RunDockerContracts.py', '--cpus', '12', '--cpuset-cpus', cpuset, '--output', str(output)], check=True)

      - name: Report strict result and accepted integration debt
        if: always() && steps.contracts.outputs.output_dir != ''
        shell: python {0}
        env:
          CONTRACT_OUTPUT: ${{ steps.contracts.outputs.output_dir }}
        run: |
          import json, os
          from pathlib import Path
          result_path = Path(os.environ['CONTRACT_OUTPUT']) / 'container-result.json'
          result = json.loads(result_path.read_text()) if result_path.exists() else {'state': 'NO_RESULT'}
          lines = ['IAmSpeed contracts: ' + result['state']]
          for debt in result.get('accepted_debt', []):
              lines.append('- Accepted integration debt (raw Fail retained): ' + debt['test'])
          if result['state'] == 'PASS_WITH_ACCEPTED_DEBT':
              print('::warning::Human-accepted test debt remains; raw editor/report failures are preserved.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')

      - name: Upload exact run diagnostics
        if: always() && steps.contracts.outputs.output_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: iamspeed-physical-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.contracts.outputs.output_dir }}/Logs/**
            ${{ steps.contracts.outputs.output_dir }}/Automation/**
            ${{ steps.contracts.outputs.output_dir }}/CollisionMatrix042/**
            ${{ steps.contracts.outputs.output_dir }}/*.json
            ${{ steps.contracts.outputs.output_dir }}/container.stdout.log
          if-no-files-found: warn
